name: Force Sync to Aliyun

on:
  workflow_run:
    workflows: ["自动构建并上传"] # 对应上一个 Action 的 name 字段
    types:
      - completed

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 只有在前一个工作流执行成功时才触发同步
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dist # 显式指定拉取 dist 分支
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      - name: Add aliyun remote
        run: |
          git remote add aliyun https://${{secrets.ALIYUN_ACCOUNT}}:${{secrets.ALIYUN_PASSWORD}}@codeup.aliyun.com/69624f9a58acb3fac7aed520/ATTomatoo/zhenxun_bot_webui.git
          git fetch aliyun dist --force

      - name: Force push
        run: git push --progress --force aliyun HEAD:dist
